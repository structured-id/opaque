name: Publish to npm

on:
  release:
    types: [published]
  # Publish an existing release again (after a failed publish), by its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. opaque-v2.0.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - run: corepack enable
      # Trusted publishing setup as documented for setup-node v7: the registry
      # is configured and no NODE_AUTH_TOKEN is set, so npm authenticates by
      # exchanging the job's OIDC token. No package cache in a publish job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: yarn install --immutable
      - run: yarn build
      # Auth: npm trusted publishing via OIDC (id-token: write + environment: release).
      # Configured at npmjs.com → Package Settings → Trusted Publishers:
      #   Organization: structured-id, Repository: opaque,
      #   Workflow: publish.yml, Environment: release
      # The release tag is `opaque-v<version>` and must match package.json.
      # Verbose logging shows the registry's answer when the OIDC exchange is refused.
      - name: Publish to npm
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PV="$(node -p "require('./package.json').version")"
          if [ "${PV}" != "${TAG##*-v}" ]; then
            echo "Release tag version (${TAG##*-v}) != package.json (${PV})."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} already published; skipping."
            exit 0
          fi
          npm publish --access public --provenance
