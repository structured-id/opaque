name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          # NO registry-url — it creates .npmrc with NODE_AUTH_TOKEN which
          # overrides OIDC trusted publishing with an invalid GITHUB_TOKEN
      - run: yarn install --immutable
      - run: yarn build
      # Auth: npm trusted publishing via OIDC (id-token: write + environment: release).
      # Configured at npmjs.com → Package Settings → Trusted Publishers:
      #   Organization: structured-id, Repository: opaque,
      #   Workflow: publish.yml, Environment: release
      # The release tag is `opaque-v<version>` and must match package.json.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PV="$(node -p "require('./package.json').version")"
          if [ "${PV}" != "${TAG##*-v}" ]; then
            echo "Release tag version (${TAG##*-v}) != package.json (${PV})."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} already published; skipping."
            exit 0
          fi
          npm publish --access public --provenance
