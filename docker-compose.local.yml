name: opaque-local

services:
  # OPAQUE test server (server-side protocol over HTTP)
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: opaque-server
    ports:
      - "${OPAQUE_PORT:-8090}:8080"
    environment:
      PORT: "${OPAQUE_INTERNAL_PORT:-8080}"
      SUITE: P256_SHA256
      SERVER_ID: sid.example.com
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opaque

  # Test runner (unit + integration)
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    container_name: opaque-test
    depends_on:
      server:
        condition: service_healthy
    environment:
      OPAQUE_SERVER_URL: http://server:8080
    networks:
      - opaque
    profiles:
      - test

networks:
  opaque:
    driver: bridge
